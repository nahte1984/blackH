<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Black Holes and Revelations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&display=swap" rel="stylesheet">
<style>
/* blackH v2 — 坐在太空船上一直往前飛。
   畫面中央一個很小的黑洞；它後面是一層一層的畫面框，越遠的框越小、光要走越久，所以顯示的是越久以前的你。
   框一路朝你飛過來、往外展開，邊飛邊追上現在。
   每一層框本身也被「它自己的黑洞」彎過一次，再被中央的黑洞彎第二次 → 扭曲兩次。 */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body {
  margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #313131; color: #ccc;
  touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; background: #000; }
.bg { font-family: "Bricolage Grotesque", "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 600;
  font-variation-settings: "opsz" 14, "wdth" 100; }

/* ---- 開始畫面（Figma: layouts-II） ---- */
#splash {
  position: fixed; inset: 0; background: #313131;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px;
  font-size: 24px; line-height: 12px; text-align: center; white-space: nowrap; transition: opacity .9s;
}
#go {
  font: inherit; font-variation-settings: inherit; line-height: 12px; color: #ccc; background: none; border: 0; cursor: pointer;
  padding: 16px 28px; margin: -16px -28px; touch-action: manipulation; transition: opacity .2s;
}
#go:active { opacity: .5; }
#title { color: transparent; -webkit-background-clip: text; background-clip: text;
  background-image: linear-gradient(90deg, #f00, #ffe100); padding: 6px 0; margin: -6px 0; }
#fail {
  position: absolute; left: 0; right: 0; top: calc(50% + 56px); display: flex; flex-direction: column; align-items: center; gap: 14px;
  font-size: 13px; line-height: 1.5; white-space: normal; padding: 0 24px;
}
#fail .row { display: flex; gap: 22px; }
#fail button, #fail label {
  font: inherit; font-variation-settings: inherit; color: #ccc; background: none; border: 0; padding: 8px 0; cursor: pointer;
  text-decoration: underline; text-underline-offset: 4px;
}
#fail input { display: none; }
#err { opacity: .75; max-width: 24em; }

#hint {
  position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 26px); transform: translateX(-50%);
  width: max-content; max-width: calc(100% - 32px); padding: 9px 16px 8px; border-radius: 999px;
  background: rgba(49,49,49,.62); font-size: 13px; line-height: 1.2; letter-spacing: .02em;
  pointer-events: none; transition: opacity .8s; opacity: 0;
}

/* ---- 調整面板（T 鍵；手機三指點一下） ---- */
#panel {
  position: fixed; top: calc(env(safe-area-inset-top, 0px) + 10px); left: 10px; width: min(300px, calc(100% - 20px));
  padding: 8px 12px 10px; background: rgba(0,0,0,.74); border: 1px solid rgba(255,255,255,.25); border-radius: 12px;
  color: #eee; font: 11px/1.3 ui-monospace, Menlo, Consolas, monospace; touch-action: pan-y;
}
#panel .head { display: flex; justify-content: space-between; opacity: .6; padding: 2px 0 6px; }
#panel .row { display: grid; grid-template-columns: 58px 1fr 50px; gap: 8px; align-items: center; min-height: 30px; }
#panel input[type=range] { width: 100%; accent-color: #fff; }
#panel output { text-align: right; font-variant-numeric: tabular-nums; }
#panel .seg { display: flex; border: 1px solid rgba(255,255,255,.45); border-radius: 999px; overflow: hidden; }
#panel .seg button { flex: 1; font: inherit; color: #eee; background: none; border: 0; padding: 6px 0; cursor: pointer; }
#panel .seg button + button { border-left: 1px solid rgba(255,255,255,.45); }
#panel .seg button.on { background: #eee; color: #111; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="splash" class="bg">
  <button id="go">Enter</button>
  <div id="title">Black Holes and Revelations</div>
  <div id="fail" hidden>
    <div id="err"></div>
    <div class="row">
      <button id="retry">Retry camera</button>
      <label>Upload photo / video<input id="file" type="file" accept="image/*,video/*"></label>
    </div>
  </div>
</div>
<div id="hint" class="bg"></div>
<div id="panel" hidden></div>

<script>
'use strict';
const P = new URLSearchParams(location.search);
const num = (k, d) => { const v = parseFloat(P.get(k)); return Number.isFinite(v) ? v : d; };

const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', {antialias: false, alpha: false, premultipliedAlpha: false});
const splash = document.getElementById('splash'), goBtn = document.getElementById('go'), titleEl = document.getElementById('title');
const failEl = document.getElementById('fail'), errEl = document.getElementById('err');
function showErr(msg, canRetry = true) {
  failEl.hidden = !msg;
  if (msg) { errEl.textContent = msg; failEl.querySelector('.row').hidden = !canRetry; }
}
// 標題的漸層沿著色相環轉，10 秒一圈（Figma 原本是 紅 0° → #ffe100 約 53°，兩端一起轉）
let hueT0 = performance.now();
function hueLoop(now) {
  if (splash.hidden) return;
  const h = ((now - hueT0) / 10000 * 360) % 360;
  titleEl.style.backgroundImage = `linear-gradient(90deg, hsl(${h.toFixed(1)},100%,50%), hsl(${(h + 53).toFixed(1)},100%,50%))`;
  requestAnimationFrame(hueLoop);
}
requestAnimationFrame(hueLoop);
if (!gl) { goBtn.hidden = true; showErr('WebGL2 is not available on this browser.', false); throw new Error('no webgl2'); }

// ---------------- 場景 ----------------
// 相機在 z = Z0 往前看；中央黑洞在原點；畫面框（世界裡的半高 HW）一層層排在黑洞後面
const Z0 = 10, F = 1.8, HW = 20, XC = 1.5 * Math.sqrt(3);   // XC: 臨界撞擊參數 b = (3√3/2) rs，比它近的光都掉進去
const N = 56, CAP_FPS = 20, HIST_LONG = 512;                  // 過去的畫面：56 張 × 20fps ≈ 2.8 秒
const tune = {
  rs:    {label: 'Mass',   min: 0.004, max: 0.15, step: 0.001, v: num('rs', 0.05),  f: v => v.toFixed(3)},  // 中央黑洞的 rs（越小黑點越小）
  speed: {label: 'Speed',  min: -1.5,  max: 2.0,  step: 0.01,  v: num('speed', 0.25), f: v => v.toFixed(2)}, // 往前飛的速度（每秒放大 e^speed 倍）；負的 = 往後退、被吸進去
  depth: {label: 'Layers', min: 1.35,  max: 4.0,  step: 0.01,  v: num('depth', 3.0), f: v => v.toFixed(2) + '×'}, // 相鄰兩層框的大小比
  twist: {label: 'Twist',  min: 0,     max: 1.5,  step: 0.01,  v: num('twist', 0.7), f: v => v.toFixed(2)}, // 每一層自己的黑洞（愛因斯坦環的半徑，框高 = 1）
  drift: {label: 'Drift',  min: 0,     max: 0.8,  step: 0.01,  v: num('drift', 0.3), f: v => v.toFixed(2)}, // 每一層的黑洞偏離中心多少
  round: {label: 'Round',  min: 0,     max: 1,    step: 0.01,  v: num('round', 1.0), f: v => v.toFixed(2)},   // 框的形狀：0 = 方（螢幕裡的螢幕）、1 = 正圓（隧道）
  delay: {label: 'Past',   min: 0,     max: (N - 1) / CAP_FPS, step: 0.05, v: num('delay', (N - 1) / CAP_FPS), f: v => v.toFixed(2) + 's'}, // 最遠那層是幾秒前
  q:     {label: 'Quality', min: 0,    max: 3,    step: 1,     v: num('q', 0),     f: v => ['high', 'mid', 'low', 'lowest'][v]},
};
const Q = [{dpr: 2, aa: 4}, {dpr: 2, aa: 1}, {dpr: 1.5, aa: 1}, {dpr: 1, aa: 1}];
const SOFT = 0.08;   // 層與層交界的柔邊（以框的比例）

// ---------------- 光的偏折表：Schwarzschild 精確解 ----------------
// α(b) = 4√u0 ∫₀¹ dt / √K(t) − π，u = u0(1 − t²)，K = u0 + u − u0² − u0·u − u²（rs = 1，u0 = 1/近日點）
// 只跟 b/rs 有關，所以一開始算一次就好。查表的變數 y = ln(b/rs − XC)，越靠近臨界值越細
const AN = 1024, AY0 = -16, AY1 = 8.3;
function deflection(r0) {
  const u0 = 1 / r0, xi0 = -18, M = 600, h = -xi0 / M;     // t = e^ξ：把光子球附近的尖峰攤開
  const g = t => { const u = u0 * (1 - t * t); return 1 / Math.sqrt(Math.max(u0 + u - u0 * u0 - u0 * u - u * u, 1e-300)); };
  let s = 0;
  for (let i = 0; i <= M; i++) { const t = Math.exp(xi0 + i * h); s += (i === 0 || i === M ? 1 : i % 2 ? 4 : 2) * t * g(t); }
  return 4 * Math.sqrt(u0) * (s * h / 3 + Math.exp(xi0) * g(0)) - Math.PI;
}
function r0ForB(x) {   // b(r0) = √(r0³ / (r0 − 1)) 反解
  let lo = Math.log(1.5), hi = Math.log(1e7);
  for (let k = 0; k < 90; k++) {
    const m = (lo + hi) / 2, r = Math.exp(m);
    if (Math.sqrt(r * r * r / (r - 1)) < x) lo = m; else hi = m;
  }
  return Math.exp((lo + hi) / 2);
}
const alphaTable = new Float32Array(AN);
for (let i = 0; i < AN; i++) alphaTable[i] = deflection(r0ForB(XC + Math.exp(AY0 + (AY1 - AY0) * i / (AN - 1))));

// ---------------- shader ----------------
const vs = `#version 300 es
in vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }`;

const fs = `#version 300 es
precision highp float;
precision highp sampler2DArray;
out vec4 o;
uniform vec2 uRes;
uniform float uRs;          // 中央黑洞
uniform float uS0, uK;      // 最深那層框的大小（螢幕單位的半高）、相鄰兩層的比
uniform int uJ;             // 層數
uniform float uNewest;      // 最深那層的編號（每層的個性用）
uniform float uSCover, uSBirth, uT, uTwist, uDrift, uDelay, uP, uAx;   // uP: 框的超橢圓次方；uAx: 框的橫向半徑（Round = 1 時等於縱向 → 正圓）
uniform int uAA;
uniform int uMode;          // 每層自己的黑洞：0 = 精確偏折，1 = 圓反演（弱場點透鏡）
uniform sampler2D uAlpha;
uniform float uCapFps, uHead, uFilled, uAspect, uMirror;
uniform sampler2D uLive;
uniform sampler2DArray uHist;
const float Z0 = ${Z0.toFixed(1)}, F = ${F.toFixed(1)}, HW = ${HW.toFixed(1)}, XC = ${XC.toFixed(9)};
const float NH = ${N}.0, AN = ${AN}.0, AY0 = ${AY0.toFixed(2)}, AY1 = ${AY1.toFixed(2)}, SOFT = ${SOFT};
const vec2 OFF[4] = vec2[4](vec2(0.125, 0.375), vec2(-0.375, 0.125), vec2(-0.125, -0.375), vec2(0.375, -0.125));

// 偏折角 α(b/rs)：查表；很遠的地方用弱場展開 α ≈ 2/x + (15π/16)/x²
float deflect(float x){
  float y = log(x - XC);
  if (y >= AY1) { float ix = 1.0 / x; return 2.0 * ix + 2.94524 * ix * ix; }
  float f = clamp((y - AY0) / (AY1 - AY0), 0.0, 1.0) * (AN - 1.0);
  float i0 = floor(f);
  float a0 = texelFetch(uAlpha, ivec2(int(i0), 0), 0).r;
  float a1 = texelFetch(uAlpha, ivec2(int(min(i0 + 1.0, AN - 1.0)), 0), 0).r;
  return mix(a0, a1, f - i0);
}

// dsec 秒前的畫面。幾乎沒延遲的地方用即時畫面（清晰）
vec3 fetch(vec2 tc, float dsec){
  if (uFilled < 0.5 || dsec < 0.03) return texture(uLive, tc).rgb;
  float fb = clamp(dsec * uCapFps, 0.0, uFilled - 1.0);
  float i0 = floor(fb);
  float l0 = mod(uHead - i0 + NH, NH);
  float l1 = mod(uHead - min(i0 + 1.0, uFilled - 1.0) + NH, NH);
  vec3 h = mix(texture(uHist, vec3(tc, l0)).rgb, texture(uHist, vec3(tc, l1)).rgb, fb - i0);
  float wl = 1.0 - smoothstep(0.03, 0.15, dsec);
  return wl > 0.0 ? mix(h, texture(uLive, tc).rgb, wl) : h;
}

// 一層框的顏色。q 是打到這層框上的位置（框的半高 = 1）
// 這層框本身也是「被它自己的黑洞彎過」的畫面：點透鏡方程 β = θ − θE² θ/|θ|²（第一次扭曲）
vec3 layerColor(vec2 q, float id, float S){
  float ph = id * 2.39996 + uT * 0.21;                 // 每層的黑洞偏一點，方向按黃金角錯開、慢慢轉
  vec2 d = q - uDrift * vec2(cos(ph), sin(ph));
  float r = length(d);
  const float RC = 0.05;                               // 這層黑洞的影子半徑（框高 = 1）
  if (r < RC) return vec3(0.0);
  vec2 beta;
  if (uMode == 1) {
    // 圓反演：弱場點透鏡 β = q − θE² d/|d|²。靠近中心時 ≈ −θE²/d̄，把無限遠的鏡像平鋪壓進小圈 → 萬花筒
    beta = q - uTwist * uTwist * d / (r * r);
  } else {
    // 精確偏折：跟中央黑洞同一張 Schwarzschild 偏折表。λ 讓遠處跟弱場一致（愛因斯坦環一樣在 θE）
    float lam = XC * uTwist * uTwist / (2.0 * RC);
    float br = r - lam * deflect(XC * r / RC);         // 以這顆黑洞為中心的徑向位置（負的 = 跑到對面）
    // 偏出框外的光不落到無限遠的平鋪上，而是像天空包著黑洞一樣在半徑方向折回 → 只有一圈圈的光子環
    br = abs(mod(br - 1.0, 4.0) - 2.0) - 1.0;
    beta = q - d + br * d / r;
  }
  vec2 tc = vec2(beta.x / (2.0 * uAspect) + 0.5, 0.5 - 0.5 * beta.y);
  if (uMirror > 0.5) tc.x = 1.0 - tc.x;
  // 越深（越小）的框越遠，光走得越久 → 越久以前的畫面
  float dsec = uDelay * clamp(log(uSCover / S) / log(uSCover / uSBirth), 0.0, 1.0);
  return fetch(tc, dsec);
}

vec3 shade(vec2 uv){
  float rho = length(uv);
  vec2 e = rho > 1e-7 ? uv / rho : vec2(1.0, 0.0);
  float hyp = sqrt(rho * rho + F * F);
  float th = atan(rho, F);
  float b = Z0 * rho / hyp;                            // 撞擊參數
  float x = b / uRs;
  if (x <= XC) return vec3(0.0);                       // 中央黑洞的影子
  // 第二次扭曲：中央黑洞把光線轉了 α。出射的直線 = 入射直線繞黑洞轉 −α
  float a = deflect(x);
  float ca = cos(a), sa = sin(a);
  float dS = cos(th - a), dY = sin(th - a);
  float dim = 1.0;
  if (dS < 0.05) { dS = max(abs(dS), 0.05); dim = 0.8; }   // 被彎回來的光（光子環）
  vec3 acc = vec3(0.0);
  float rem = 1.0;
  // 從最近（最大）的框往深處找：落在框的「邊」上就看到它，落在中間的洞就繼續往深處
  for (int j = 15; j >= 0; j--){
    if (j >= uJ) continue;
    float S = uS0 * pow(uK, float(j));
    float D = HW * F / S - Z0;                         // 這層框離黑洞多遠
    float y = Z0 * sa + (D + Z0 * ca) / dS * dY;       // 光線打到那個平面的位置（深的框被彎得多）
    vec2 q = e * (y / HW);
    float n = pow(pow(abs(q.x) / uAx, uP) + pow(abs(q.y), uP), 1.0 / uP);
    float hole = 1.0 / uK;
    float w = j == 0 ? 1.0 : smoothstep(hole, hole * (1.0 + SOFT), n);
    if (w <= 0.0) continue;
    acc += rem * w * layerColor(q, uNewest - float(j), S);
    rem *= 1.0 - w;
    if (rem < 0.004) break;
  }
  return acc * dim;
}

void main(){
  float m = min(uRes.x, uRes.y);
  vec2 uv = (gl_FragCoord.xy - 0.5 * uRes) / m;
  // 中央的環最細碎，只在那裡多打幾條光線
  int n = (uAA > 1 && length(uv) < 0.22) ? 4 : 1;
  vec3 col = vec3(0.0);
  for (int s = 0; s < 4; s++){
    if (s >= n) break;
    col += shade(uv + (n > 1 ? OFF[s] / m : vec2(0.0)));
  }
  o = vec4(col / float(n), 1.0);
}`;

function compile(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
try {
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
} catch (e) { goBtn.hidden = true; showErr('Shader error: ' + e.message, false); throw e; }
gl.useProgram(prog);
gl.bindVertexArray(gl.createVertexArray());
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
const pLoc = gl.getAttribLocation(prog, 'p');
gl.enableVertexAttribArray(pLoc);
gl.vertexAttribPointer(pLoc, 2, gl.FLOAT, false, 0, 0);
const U = {};
for (const n of ['uRes', 'uRs', 'uS0', 'uK', 'uJ', 'uNewest', 'uSCover', 'uSBirth', 'uT', 'uTwist', 'uDrift', 'uDelay', 'uP', 'uAx',
                 'uAA', 'uMode', 'uAlpha', 'uCapFps', 'uHead', 'uFilled', 'uAspect', 'uMirror', 'uLive', 'uHist'])
  U[n] = gl.getUniformLocation(prog, n);
gl.uniform1i(U.uLive, 0);
gl.uniform1i(U.uHist, 1);
gl.uniform1i(U.uAlpha, 2);

// ---------------- 貼圖：現在（0）、過去（1，陣列）、偏折表（2） ----------------
function texParams(target, filter, wrap) {
  gl.texParameteri(target, gl.TEXTURE_MIN_FILTER, filter);
  gl.texParameteri(target, gl.TEXTURE_MAG_FILTER, filter);
  gl.texParameteri(target, gl.TEXTURE_WRAP_S, wrap);
  gl.texParameteri(target, gl.TEXTURE_WRAP_T, wrap);
}
{
  const t = gl.createTexture();
  gl.activeTexture(gl.TEXTURE2);
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.R32F, AN, 1, 0, gl.RED, gl.FLOAT, alphaTable);
  texParams(gl.TEXTURE_2D, gl.NEAREST, gl.CLAMP_TO_EDGE);
}
const live = gl.createTexture();
gl.activeTexture(gl.TEXTURE0);
gl.bindTexture(gl.TEXTURE_2D, live);
gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([0, 0, 0, 255]));
texParams(gl.TEXTURE_2D, gl.LINEAR, gl.MIRRORED_REPEAT);

let hist = null, histW = 0, histH = 0, head = -1, filled = 0, capAcc = 0;
const hc = document.createElement('canvas'), hctx = hc.getContext('2d');
function allocHist(aspect) {
  const w = aspect >= 1 ? HIST_LONG : Math.round(HIST_LONG * aspect);
  const h = aspect >= 1 ? Math.round(HIST_LONG / aspect) : HIST_LONG;
  head = -1; filled = 0; capAcc = 1;
  if (hist && w === histW && h === histH) return;
  if (hist) gl.deleteTexture(hist);
  hist = gl.createTexture();
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D_ARRAY, hist);
  gl.texStorage3D(gl.TEXTURE_2D_ARRAY, 1, gl.RGBA8, w, h, N);
  texParams(gl.TEXTURE_2D_ARRAY, gl.LINEAR, gl.MIRRORED_REPEAT);
  histW = hc.width = w; histH = hc.height = h;
}
function capture(el) {
  hctx.drawImage(el, 0, 0, histW, histH);
  head = (head + 1) % N;
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D_ARRAY, hist);
  gl.texSubImage3D(gl.TEXTURE_2D_ARRAY, 0, 0, 0, head, histW, histH, 1, gl.RGBA, gl.UNSIGNED_BYTE, hc);
  filled = Math.min(filled + 1, N);
}
function uploadLive(el) {
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, live);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, el);
}

// ---------------- 畫面來源：鏡頭／上傳的照片、影片 ----------------
let src = null, srcAspect = 0;
function srcSize(s) {
  if (s.kind === 'image') return [s.el.naturalWidth, s.el.naturalHeight];
  return s.el.readyState >= 2 ? [s.el.videoWidth, s.el.videoHeight] : [0, 0];
}
function setSource(s) {
  if (src && src !== s) {
    if (src.stream) src.stream.getTracks().forEach(t => t.stop());
    if (src.url) URL.revokeObjectURL(src.url);
    if (src.kind === 'video') src.el.pause();
  }
  src = s; srcAspect = 0;
}
function feedSource(dt) {
  if (!src) return;
  const [w, h] = srcSize(src);
  if (!w || !h) return;
  if (Math.abs(w / h - srcAspect) > 1e-3) { srcAspect = w / h; allocHist(srcAspect); src.done = false; }   // 手機轉向時重新配置
  if (src.kind === 'image') {
    if (!src.done) { uploadLive(src.el); capture(src.el); src.done = true; }
    return;
  }
  uploadLive(src.el);
  capAcc += dt;
  if (capAcc >= 1 / CAP_FPS) { capAcc = Math.min(capAcc - 1 / CAP_FPS, 1 / CAP_FPS); capture(src.el); }
}

let facing = 'user', busy = false, started = false;
async function openCamera() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw Object.assign(new Error('getUserMedia unavailable'), {name: 'NotSupportedError'});
  const stream = await navigator.mediaDevices.getUserMedia({audio: false,
    video: {facingMode: facing, width: {ideal: 1280}, height: {ideal: 720}}});
  const v = document.createElement('video');
  v.muted = true; v.playsInline = true; v.setAttribute('playsinline', ''); v.srcObject = stream;
  await v.play();
  setSource({kind: 'camera', el: v, stream, mirror: facing === 'user'});
}
async function startCamera() {
  if (busy) return;
  busy = true; showErr(null); goBtn.style.opacity = .5;
  try { await openCamera(); enter(); }
  catch (e) { showErr('Camera unavailable (' + (e.name || e.message) + '). Allow camera access and retry, or upload a photo / video.'); }
  finally { busy = false; goBtn.style.opacity = ''; }
}
async function flipCamera() {   // 點兩下：切換前後鏡頭
  if (!src || src.kind !== 'camera' || busy) return;
  busy = true;
  src.stream.getTracks().forEach(t => t.stop());   // iPhone 要先關掉舊的才能開另一顆
  facing = facing === 'user' ? 'environment' : 'user';
  try { await openCamera(); }
  catch (e) { facing = facing === 'user' ? 'environment' : 'user'; try { await openCamera(); } catch (_) {} setHint('Could not switch camera', 2500); }
  finally { busy = false; }
}
goBtn.addEventListener('click', startCamera);
document.getElementById('retry').addEventListener('click', startCamera);
const fileIn = document.getElementById('file');
fileIn.addEventListener('change', () => {
  const f = fileIn.files[0];
  if (!f) return;
  const url = URL.createObjectURL(f);
  const fail = () => { URL.revokeObjectURL(url); showErr('This file could not be opened.'); };
  if (f.type.startsWith('video')) {
    const v = document.createElement('video');
    v.muted = true; v.loop = true; v.playsInline = true; v.setAttribute('playsinline', ''); v.src = url;
    v.play().then(() => { setSource({kind: 'video', el: v, url, mirror: false}); enter(); }).catch(fail);
  } else {
    const img = new Image();
    img.onload = () => { setSource({kind: 'image', el: img, url, mirror: false}); enter(); };
    img.onerror = fail;
    img.src = url;
  }
  fileIn.value = '';
});
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && src && (src.kind === 'camera' || src.kind === 'video')) src.el.play().catch(() => {});
});

const hintEl = document.getElementById('hint');
let hintTimer = 0;
function setHint(text, ms) {
  clearTimeout(hintTimer);
  hintEl.textContent = text; hintEl.style.opacity = 1;
  hintTimer = setTimeout(() => { hintEl.style.opacity = 0; }, ms);
}
function enter() {
  if (started) return;
  started = true;
  splash.style.opacity = 0;
  setTimeout(() => { splash.hidden = true; }, 900);
  setHint(matchMedia('(pointer: fine)').matches ? 'drag ↕ speed · scroll mass · double-click flip · T'
                                               : 'drag ↕ speed · pinch mass · double-tap flip', 5000);
}

// ---------------- 調整面板 ----------------
const panel = document.getElementById('panel');
const sliders = {};
let manualQ = P.has('q');
{
  const h = document.createElement('div'); h.className = 'head';
  const t = document.createElement('span'); t.textContent = 'blackH';
  const fpsOut = document.createElement('span'); fpsOut.id = 'fps';
  h.append(t, fpsOut); panel.append(h);
  for (const [k, o] of Object.entries(tune)) {
    const row = document.createElement('label'); row.className = 'row';
    const l = document.createElement('span'); l.textContent = o.label;
    const r = document.createElement('input'); r.type = 'range';
    Object.assign(r, {min: o.min, max: o.max, step: o.step, value: o.v});
    const out = document.createElement('output'); out.textContent = o.f(o.v);
    r.addEventListener('input', () => { o.v = parseFloat(r.value); out.textContent = o.f(o.v); if (k === 'q') manualQ = true; });
    row.append(l, r, out); panel.append(row);
    sliders[k] = {r, out};
  }
}
function syncSlider(k) { const o = tune[k], s = sliders[k]; s.r.value = o.v; s.out.textContent = o.f(o.v); }
// 每層黑洞的公式：精確偏折／圓反演（預設）。?lens=exact 可以直接用精確偏折開
let lensMode = P.get('lens') === 'exact' ? 0 : 1;
{
  const row = document.createElement('div'); row.className = 'row';
  const l = document.createElement('span'); l.textContent = 'Lens';
  const seg = document.createElement('div'); seg.className = 'seg'; seg.style.gridColumn = '2 / 4';
  const btns = ['Exact', 'Inversion'].map((name, i) => {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = name;
    b.addEventListener('click', () => { lensMode = i; btns.forEach((x, k) => x.classList.toggle('on', k === lensMode)); });
    return b;
  });
  btns.forEach((x, k) => x.classList.toggle('on', k === lensMode));
  seg.append(...btns); row.append(l, seg);
  panel.insertBefore(row, sliders.twist.r.closest('.row'));
}
const togglePanel = () => { panel.hidden = !panel.hidden; };
if (P.has('panel')) panel.hidden = false;
addEventListener('keydown', e => { if (e.key === 't' || e.key === 'T') togglePanel(); });

// ---------------- 操作：上下拖曳改速度、捏合／滾輪改質量、點兩下換鏡頭 ----------------
const pts = new Map();
let pinch0 = null, lastTap = 0;
const clampTo = (o, v) => Math.max(o.min, Math.min(o.max, v));
canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  pts.set(e.pointerId, {x: e.clientX, y: e.clientY, x0: e.clientX, y0: e.clientY, t0: performance.now()});
  if (pts.size === 2) {
    const [a, b] = [...pts.values()];
    pinch0 = {d: Math.hypot(a.x - b.x, a.y - b.y) || 1, rs: tune.rs.v};
  }
  if (pts.size === 3) togglePanel();
});
canvas.addEventListener('pointermove', e => {
  const p = pts.get(e.pointerId);
  if (!p) return;
  const dy = e.clientY - p.y;
  p.x = e.clientX; p.y = e.clientY;
  if (pts.size === 1) {
    if (Math.abs(p.y - p.y0) < 8) return;          // 輕點不算拖曳
    tune.speed.v = clampTo(tune.speed, tune.speed.v - dy / innerHeight * 3);
    syncSlider('speed');
    setHint('speed ' + tune.speed.v.toFixed(2), 900);
  } else if (pts.size === 2 && pinch0) {
    const [a, b] = [...pts.values()];
    tune.rs.v = clampTo(tune.rs, pinch0.rs * Math.hypot(a.x - b.x, a.y - b.y) / pinch0.d);
    syncSlider('rs');
  }
});
function pointerEnd(e) {
  const p = pts.get(e.pointerId);
  if (!p) return;
  const now = performance.now();
  if (pts.size === 1 && Math.hypot(p.x - p.x0, p.y - p.y0) < 10 && now - p.t0 < 280) {
    if (now - lastTap < 330) { flipCamera(); lastTap = 0; } else lastTap = now;
  }
  pts.delete(e.pointerId);
  if (pts.size < 2) pinch0 = null;
}
canvas.addEventListener('pointerup', pointerEnd);
canvas.addEventListener('pointercancel', pointerEnd);
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  tune.rs.v = clampTo(tune.rs, tune.rs.v * Math.exp(-e.deltaY * 0.0015));
  syncSlider('rs');
}, {passive: false});

// ---------------- 畫質：重的時候自動降 ----------------
let slow = 0, fps = 60;
function watchSpeed(dt) {
  fps += (1 / Math.max(dt, 1e-3) - fps) * 0.05;
  if (manualQ) return;
  if (dt > 1 / 40 && dt < 0.25) slow++; else slow = Math.max(0, slow - 1);
  if (slow > 45 && tune.q.v < Q.length - 1) { tune.q.v++; syncSlider('q'); slow = 0; }
}
function resize() {
  const dpr = Math.min(devicePixelRatio || 1, Q[tune.q.v].dpr);
  const w = Math.max(1, Math.round(canvas.clientWidth * dpr)), h = Math.max(1, Math.round(canvas.clientHeight * dpr));
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  gl.viewport(0, 0, w, h);
}

// ---------------- 迴圈 ----------------
const fpsEl = document.getElementById('fps');
let last = 0, T = num('t', 0), travel = num('travel', 0), rs = tune.rs.v;
function frame(now) {
  const dt = last ? Math.min((now - last) / 1000, 0.1) : 1 / 60;
  last = now;
  requestAnimationFrame(frame);
  if (!started) return;                               // 開始畫面時不畫（省電）
  T += dt;
  travel += tune.speed.v * dt;                        // 飛了多遠（以 e 倍為單位：每單位畫面放大 e 倍）
  watchSpeed(dt);
  resize();
  rs += (tune.rs.v - rs) * (1 - Math.exp(-dt * 6));
  feedSource(dt);

  // 層的配置：最深那層從黑點的邊緣誕生，每飛 ln(K) 就多一層；最外那層要蓋滿螢幕四角
  const K = tune.depth.v, lnK = Math.log(K);
  const shadow = F * Math.tan(Math.asin(Math.min(XC * rs / Z0, 0.99)));   // 黑點在螢幕上的半徑
  const sBirth = 0.8 * shadow;
  const newest = Math.floor(travel / lnK);
  const s0 = sBirth * Math.exp(travel - newest * lnK);
  const m = Math.min(canvas.clientWidth, canvas.clientHeight) || 1;
  const a = srcAspect || 1;
  const pw = 10 - 8 * tune.round.v;                   // 超橢圓：|x/ax|^p + |y|^p = 1（p 大 → 方，p = 2 且 ax = 1 → 正圓）
  const ax = a + (1 - a) * tune.round.v;              // 方的時候跟畫面同比例，越圓越接近 1
  const sCover = Math.pow(Math.pow(0.5 * canvas.clientWidth / m / ax, pw) + Math.pow(0.5 * canvas.clientHeight / m, pw), 1 / pw) * 1.02;
  const J = Math.min(16, Math.max(1, Math.ceil(Math.log(sCover / s0) / lnK) + 1));

  gl.useProgram(prog);
  gl.uniform2f(U.uRes, canvas.width, canvas.height);
  gl.uniform1f(U.uRs, rs);
  gl.uniform1f(U.uS0, s0);
  gl.uniform1f(U.uK, K);
  gl.uniform1i(U.uJ, J);
  gl.uniform1f(U.uNewest, newest);
  gl.uniform1f(U.uSCover, sCover);
  gl.uniform1f(U.uSBirth, sBirth);
  gl.uniform1f(U.uT, T);
  gl.uniform1f(U.uTwist, tune.twist.v);
  gl.uniform1f(U.uDrift, tune.drift.v);
  gl.uniform1f(U.uDelay, tune.delay.v);
  gl.uniform1f(U.uP, pw);
  gl.uniform1f(U.uAx, ax);
  gl.uniform1i(U.uAA, Q[tune.q.v].aa);
  gl.uniform1i(U.uMode, lensMode);
  gl.uniform1f(U.uCapFps, CAP_FPS);
  gl.uniform1f(U.uHead, Math.max(head, 0));
  gl.uniform1f(U.uFilled, hist ? filled : 0);
  gl.uniform1f(U.uAspect, a);
  gl.uniform1f(U.uMirror, src && src.mirror ? 1 : 0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  if (!panel.hidden) fpsEl.textContent = fps.toFixed(0) + ' fps';
}
requestAnimationFrame(frame);
</script>
</body>
</html>
